[project]
name = "keyring-client"
version = "0.1.0"
description = "How every service in the LUCY family believes a keyring token and fetches a credential."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "tochi-mba" }]
dependencies = ["httpx>=0.27", "pyjwt[crypto]>=2.9"]

[project.urls]
Repository = "https://github.com/tochi-mba/Keyring-api"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["keyring_client"]
